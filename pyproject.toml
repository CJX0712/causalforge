[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scikit-learn>=1.4", "lightgbm>=4.0", "xgboost>=2.0"]

[tool.setuptools.packages.find]
include = ["causalforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q -W ignore::UserWarning"
