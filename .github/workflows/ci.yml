name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check causalforge tests

      - name: Tests (pytest)
        run: python -m pytest -q -W ignore::UserWarning

      - name: Demo smoke (Monte-Carlo benchmark <= 60s budget)
        run: python -m causalforge.examples.run_demo
